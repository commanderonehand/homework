name: K8s Monitoring
on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: self-hosted
    steps:
      - name: Setup kubectl
        run: |
          export KUBECONFIG=/home/user/.kube/config-k8s
          echo "KUBECONFIG=$KUBECONFIG" >> $GITHUB_ENV
          
          echo "Testing connection..."
          kubectl cluster-info || {
            echo "Cannot connect to cluster"
            echo "Current context:"
            kubectl config current-context
            echo "Available contexts:"
            kubectl config get-contexts
          }
      - name: Check pods
        id: monitor
        #env:
        #  KUBECONFIG: /home/user/.kube/config-k8s
        run: |
          PROBLEM_PODS=$(kubectl get pods -A | grep -E "CrashLoopBackOff|Error|Evicted|Pending|ImagePullBackOff|CreateContainerError" || true)
          
          if [ -n "$PROBLEM_PODS" ]; then
            {
              echo "has_errors=true"
              echo "message<<EOF"
              echo "Проблемные поды в кластере"
              echo ""
              echo "\`\`\`"
              echo "$PROBLEM_PODS"
              echo "\`\`\`"
              echo ""
              echo "$(date '+%H:%M %d.%m.%Y')"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Send telegram alert
        if: always()
        #if: steps.monitor.outputs.has_errors == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.monitor.outputs.message }}
